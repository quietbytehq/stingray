# Continuous integration for Stingray File Manager.
#   check:   type-check, frontend tests, Rust unit and integration tests (Linux).
#   linux:   AppImage and .deb, uploaded as artifacts.
#   windows: .msi, uploaded as an artifact.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Check (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: bash scripts/fetch-rclone.sh
      - name: Rust tests
        env:
          STINGRAY_TEST_RCLONE: ${{ github.workspace }}/src-tauri/binaries/stingray-rclone-x86_64-unknown-linux-gnu
        run: cargo test --manifest-path src-tauri/Cargo.toml

  linux:
    name: Build (Linux)
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run bundle:linux
      - uses: actions/upload-artifact@v4
        with:
          name: stingray-linux-x86_64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

  windows:
    name: Build (Windows)
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run bundle:windows
      - uses: actions/upload-artifact@v4
        with:
          name: stingray-windows-x86_64
          path: src-tauri/target/release/bundle/msi/*.msi
