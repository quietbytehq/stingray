# Continuous integration for Stingray File Manager.
#   check:   type-check, frontend tests, Rust unit and integration tests (Linux).
#   linux:   AppImage and .deb, uploaded as artifacts.
#   windows: .msi, uploaded as an artifact.
#   release: on a version tag (v2.0.1…), attaches the AppImage, .deb and .msi to the GitHub release.
#   snap:    on a version tag, builds the snap from the .deb and uploads it to the Snap Store (edge).
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Check (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: bash scripts/fetch-rclone.sh
      - name: Rust tests
        env:
          STINGRAY_TEST_RCLONE: ${{ github.workspace }}/src-tauri/binaries/stingray-rclone-x86_64-unknown-linux-gnu
        run: cargo test --manifest-path src-tauri/Cargo.toml

  linux:
    name: Build (Linux)
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run bundle:linux
      - uses: actions/upload-artifact@v4
        with:
          name: stingray-linux-x86_64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

  windows:
    name: Build (Windows)
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run bundle:windows
      - uses: actions/upload-artifact@v4
        with:
          name: stingray-windows-x86_64
          path: src-tauri/target/release/bundle/msi/*.msi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.AppImage
            dist/**/*.deb
            dist/**/*.msi

  snap:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: stingray-linux-x86_64
          path: artifact
      - run: mkdir -p dist && cp artifact/deb/*.deb dist/
      - uses: snapcore/action-build@v1
        id: build
      - uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: edge
